schema_version: 1
name: s3-storage
runtimes: [node]
secrets: [S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]
network:
  type: egress
  # The bucket host varies per tenant, so the fixed list is empty and the plan prints this hint.
  egress_hint: 'your bucket host: <bucket>.s3.<region>.amazonaws.com on AWS, or the host of your custom endpoint'
