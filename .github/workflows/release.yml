# Publishes from master only, with npm trusted publishing (OIDC): no npm token exists anywhere.
# Each package on npmjs.com trusts ONLY this workflow file in this repository.
name: release

# Run by hand only (Actions → release → Run workflow). `changeset publish` publishes EVERY non-private
# package whose version is not on npm yet. Every non-private package is on npm today, so a run publishes
# only what a changeset bumps. A new package's first version is published by hand (npm trusted
# publishing needs the package to exist). See ADR-0002 §5.1.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the "version packages" PR and git tags
      pull-requests: write
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1
      - run: npm ci --ignore-scripts
      # v1: action v2 refuses Changesets CLI 2, which this repo uses.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Push through the GitHub API: checkout keeps no git credentials.
          commitMode: github-api
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
